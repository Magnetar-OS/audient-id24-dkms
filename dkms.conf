# build.sh copies vendor/<series of ${kernelver}>, patches it and builds
# snd-usb-audio; see the comment at its top. PACKAGE_VERSION is filled in by
# the package.
#
# Installed to /updates/dkms, where depmod looks before kernel/. DKMS moves the
# stock snd-usb-audio.ko.zst into /var/lib/dkms/<module>/original_module while
# this module is installed and puts it back on removal, so `pacman -Qkk`
# reports it missing in the meantime.
PACKAGE_NAME="audient-id24"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="snd-usb-audio"
BUILT_MODULE_LOCATION[0]="src/sound/usb/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="bash ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build.sh ${kernelver} ${kernel_source_dir}"
AUTOINSTALL="yes"
