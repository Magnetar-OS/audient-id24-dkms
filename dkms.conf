# build.sh downloads sound/usb for ${kernelver}, patches it and builds
# snd-usb-audio; see the comment at its top. PACKAGE_VERSION is filled in by
# the package.
PACKAGE_NAME="audient-id24"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="snd-usb-audio"
BUILT_MODULE_LOCATION[0]="src/sound/usb/"
DEST_MODULE_LOCATION[0]="/kernel/sound/usb"
MAKE[0]="bash ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build.sh ${kernelver} ${kernel_source_dir}"
AUTOINSTALL="yes"
