Comment "Audient iD24 USB-Audio"

# Feature unit 12 is the monitor-mix level (4 of the 6 mixer channels).
# Kernels with the mixer-map quirk name it "Monitor Mix Playback Volume",
# older kernels export it as "Speaker Playback Volume" and desktop audio
# adopts it as the stream master, which attenuates channels asymmetrically
# below 0 dB.  Keep all four gains at unity under either name.
Define.MonitorMixVolume "Speaker Playback Volume"

If.renamed-monitor-mix-volume {
	Condition {
		Type ControlExists
		Control "name='Monitor Mix Playback Volume'"
	}
	True.Define.MonitorMixVolume "Monitor Mix Playback Volume"
}

FixedBootSequence [
	cset "name='${var:MonitorMixVolume}' 127,127,127,127"
]

SectionUseCase."HiFi" {
	Comment "Default"
	File "/USB-Audio/Audient/Audient-iD24-HiFi-000d.conf"
}

Include.dhw.File "/common/directm.conf"

Macro.0.DirectUseCase { Id="Direct" PlaybackChannels=16 CaptureChannels=12 }
