# SPDX-License-Identifier: BSD-3-Clause
#
# Audient iD24, channel layout as labelled by the device's string
# descriptors:
#
#   playback (16): Analogue 1-6, Loop-back 1 (L), Loop-back 2 (R),
#                  SPDIF-1/ADAT-1, SPDIF-2/ADAT-2, ADAT-3 .. ADAT-8
#   capture  (12): Analogue 1-2, SPDIF-1/ADAT-1, SPDIF-2/ADAT-2,
#                  ADAT-3 .. ADAT-8, Loop-back 1 (L), Loop-back 2 (R)
#
# The optical channels depend on the ADAT/S-PDIF mode set from the vendor
# software and are left to the Direct use case, as in the iD14 profiles.

Include.pcm_split.File "/common/pcm/split.conf"

SectionVerb {
	EnableSequence [
		cset "name='${var:MonitorMixVolume}' 127,127,127,127"
	]
}

Macro [
	{
		SplitPCM {
			Name "id24_stereo_out"
			Direction Playback
			Format S32_LE
			Channels 2
			HWChannels 16
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
		}
	}
	{
		SplitPCM {
			Name "id24_mono_in"
			Direction Capture
			Format S32_LE
			Channels 1
			HWChannels 12
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
			HWChannelPos10 MONO
			HWChannelPos11 MONO
		}
	}
	{
		SplitPCM {
			Name "id24_stereo_in"
			Direction Capture
			Format S32_LE
			Channels 2
			HWChannels 12
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
		}
	}
]

SectionDevice."Line1" {
	Comment "Analogue Output 1-2"

	Value {
		PlaybackPriority 300
		PlaybackChannels 2
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "id24_stereo_out"
		Direction Playback
		HWChannels 16
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Analogue Output 3-4"

	Value {
		PlaybackPriority 200
		PlaybackChannels 2
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "id24_stereo_out"
		Direction Playback
		HWChannels 16
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line3" {
	Comment "Analogue Output 5-6"

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "id24_stereo_out"
		Direction Playback
		HWChannels 16
		Channels 2
		Channel0 4
		Channel1 5
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Mic1" {
	Comment "Mic/Line Input 1"

	Value {
		CapturePriority 300
		CaptureChannels 1
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "id24_mono_in"
		Direction Capture
		HWChannels 12
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Mic2" {
	Comment "Mic/Line Input 2"

	Value {
		CapturePriority 200
		CaptureChannels 1
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "id24_mono_in"
		Direction Capture
		HWChannels 12
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}

# Playback channels 7-8 are the loop-back send; whatever is played there
# comes back on capture channels 11-12.
SectionDevice."USB" {
	Comment "Loop-back"

	Value {
		PlaybackPriority 50
		PlaybackChannels 2
		CapturePriority 100
		CaptureChannels 2
	}
	Macro.pcm_split_p.SplitPCMDevice {
		Name "id24_stereo_out"
		Direction Playback
		HWChannels 16
		Channels 2
		Channel0 6
		Channel1 7
		ChannelPos0 FL
		ChannelPos1 FR
	}
	Macro.pcm_split_c.SplitPCMDevice {
		Name "id24_stereo_in"
		Direction Capture
		HWChannels 12
		Channels 2
		Channel0 10
		Channel1 11
		ChannelPos0 FL
		ChannelPos1 FR
	}
}
